params:
  - id: admin_email
    type: string
    name: Admin email
    description: "Email address for the AdventureLog administrator account."
    default_value: "admin@example.com"
    optional: false
  - id: admin_password
    type: secret
    name: Admin password
    description: "Password for the AdventureLog administrator account, at least 12 characters."
    default_value: "$random(len=20)"
    optional: false
locales:
  zh:
    admin_email:
      name: 管理员邮箱
      description: AdventureLog 管理员账号的邮箱。
    admin_password:
      name: 管理员密码
      description: AdventureLog 管理员账号的登录密码，至少 12 位。默认随机生成，覆盖上游内置的 admin/admin 弱口令。
